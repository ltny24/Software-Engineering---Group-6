# ============================================================
# MyUS – Development Profile (H2 in-memory, no Flyway)
# ============================================================

# ----- H2 In-Memory Database -----
spring.datasource.url=jdbc:h2:mem:myus;DB_CLOSE_DELAY=-1;MODE=MSSQLServer;INIT=CREATE SCHEMA IF NOT EXISTS myus
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ----- JPA / Hibernate – auto-create from entities -----
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false

# ----- Disable Flyway (SQL Server syntax incompatible with H2) -----
spring.flyway.enabled=false

# ----- Seed data via DevDataInitializer component -----
spring.sql.init.mode=never
